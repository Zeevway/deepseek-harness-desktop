name: Validate desktop changes

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify versions, scripts, and runtime closure
        run: npm run verify

      - name: Run unit tests
        run: npm test

      - name: Run Harness migration smoke
        run: npm run test:dsh

      - name: Build and verify x64 NSIS installer
        run: npm run build:x64

      - name: Smoke test packaged application
        run: node scripts/smoke-packaged.cjs

      - name: Verify packaged UI at desktop, high DPI, and high contrast
        run: node scripts/capture-ui.cjs "release/win-unpacked/DeepSeek Harness Desktop.exe"

      - name: Smoke test final NSIS install, repair, and uninstall
        run: npm run test:installer

      - name: Upload UI verification captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deepseek-harness-desktop-ui-captures
          path: test-results/ui-capture/*.png
          if-no-files-found: ignore
          retention-days: 14
